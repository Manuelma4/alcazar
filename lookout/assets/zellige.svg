<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>Zellige khatam tessellation</title>
  <!-- Used as a CSS mask: only the alpha channel matters; colour comes from CSS. -->
  <g fill="none" stroke="#000" stroke-width="1" stroke-linejoin="round">
    <!-- 8-pointed star (khatam): two interlaced squares centred on the tile -->
    <rect x="30" y="30" width="36" height="36"/>
    <path d="M48 22.55 L73.45 48 L48 73.45 L22.55 48 Z"/>
    <path d="M48 36 L56.49 39.51 L60 48 L56.49 56.49 L48 60 L39.51 56.49 L36 48 L39.51 39.51 Z"/>
    <!-- quarter stars on the four corners (complete across neighbouring tiles) -->
    <rect x="-10" y="-10" width="20" height="20"/>
    <path d="M0 -14.14 L14.14 0 L0 14.14 L-14.14 0 Z"/>
    <rect x="86" y="-10" width="20" height="20"/>
    <path d="M96 -14.14 L110.14 0 L96 14.14 L81.86 0 Z"/>
    <rect x="-10" y="86" width="20" height="20"/>
    <path d="M0 81.86 L14.14 96 L0 110.14 L-14.14 96 Z"/>
    <rect x="86" y="86" width="20" height="20"/>
    <path d="M96 81.86 L110.14 96 L96 110.14 L81.86 96 Z"/>
    <!-- interlacing bands that join the stars into a lattice -->
    <path d="M30 30 L10 10 M66 30 L86 10 M30 66 L10 86 M66 66 L86 86"/>
    <path d="M48 22.55 V0 M48 73.45 V96 M22.55 48 H0 M73.45 48 H96"/>
    <path d="M14.14 0 L30 15.86 M81.86 0 L66 15.86 M0 14.14 L15.86 30 M96 14.14 L80.14 30"/>
    <path d="M14.14 96 L30 80.14 M81.86 96 L66 80.14 M0 81.86 L15.86 66 M96 81.86 L80.14 66"/>
  </g>
</svg>
