# SPDX-License-Identifier: Apache-2.0
name: Watchtower — COBOL & Fortran security scan
description: Static security analysis for legacy COBOL and Fortran, with SARIF output for GitHub code scanning.
author: Alcazar
branding:
  icon: shield
  color: purple

inputs:
  paths:
    description: Files or directories to scan, separated by spaces or new lines.
    default: .
  fail-on:
    description: Fail when an unsuppressed finding is at or above this severity (critical, high, medium, low, info or none).
    default: high
  sarif-file:
    description: Where to write the SARIF 2.1.0 report (upload it with github/codeql-action/upload-sarif).
    default: watchtower.sarif
  exclude:
    description: Glob patterns to leave out, separated by spaces or new lines.
    default: ''

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Watchtower
      shell: bash
      # Inputs reach the script through the environment, never by template
      # expansion inside it, so no input can inject shell code.
      env:
        WATCHTOWER_PATHS: ${{ inputs.paths }}
        WATCHTOWER_FAIL_ON: ${{ inputs.fail-on }}
        WATCHTOWER_SARIF: ${{ inputs.sarif-file }}
        WATCHTOWER_EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        set -f  # patterns such as **/*.cpy are for Watchtower, not for bash
        read -r -a paths <<< "$(printf '%s' "$WATCHTOWER_PATHS" | tr '\n' ' ')"
        excludes=()
        for pattern in $(printf '%s' "$WATCHTOWER_EXCLUDE" | tr '\n' ' '); do
          excludes+=(--exclude "$pattern")
        done
        cli="$GITHUB_ACTION_PATH/bin/watchtower.mjs"
        # SARIF first, so an upload step with `if: always()` has a report even
        # when the gate below fails the job.
        # ${a[@]+"${a[@]}"}: an empty array under `set -u` breaks bash < 4.4
        # (macOS self-hosted runners still ship bash 3.2).
        node "$cli" scan "${paths[@]}" ${excludes[@]+"${excludes[@]}"} --format sarif --output "$WATCHTOWER_SARIF" --fail-on none
        node "$cli" scan "${paths[@]}" ${excludes[@]+"${excludes[@]}"} --fail-on "$WATCHTOWER_FAIL_ON"
