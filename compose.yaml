# docker compose up --build   ->   open the sign-in link it prints
#                                  (http://localhost:8080/#signin=…)
services:
  alcazar:
    build: .
    image: alcazar:0.1.0
    ports:
      # Published on the loopback interface only.
      - "127.0.0.1:8080:8080"
    environment:
      # The showcase: the Siege lab's tamper endpoint, for the operator only.
      ALCAZAR_DEMO: "1"
      # A lasting master key and operator token (otherwise fresh ones per
      # start, the token printed as a sign-in link): uncomment these lines,
      # `secrets` below and the top-level `secrets` block.
      # ALCAZAR_KEY_FILE: /run/secrets/alcazar_master_key
      # ALCAZAR_API_TOKEN_FILE: /run/secrets/alcazar_operator_token
    # secrets:
    #   - alcazar_master_key
    #   - alcazar_operator_token
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

# The secret files, readable by the container's user (uid 10001) only and
# mounted read-only, outside the job directory: the master key is 64
# lower-case hex digits, the operator token 32 printable characters or more.
#   (umask 077 && openssl rand -hex 32 > master.key && openssl rand -base64 33 | tr -d '\n' > operator.token)
#   sudo chown 10001 master.key operator.token
# secrets:
#   alcazar_master_key:
#     file: ./master.key
#   alcazar_operator_token:
#     file: ./operator.token
